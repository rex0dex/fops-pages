{%- comment -%}
  Accessibility row for Friends of Poway Seniors pages, under the OCS header
  (the OCS site-header is the main top bar; our pages are in its nav_pages).
  Styles: _sass/open-coding/fops-site.scss.
  Loads assets/js/fops/site.js (text size and Nod to select).
{%- endcomment -%}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<div class="fops-access" role="group" aria-label="Accessibility">
  <div class="fops-container">
    <span>Text size</span>
    <button class="ocs__btn small" type="button" data-size="normal" aria-pressed="true">A<span class="sr-only"> normal</span></button>
    <button class="ocs__btn small" type="button" data-size="large" aria-pressed="false">A<span class="sr-only"> large</span></button>
    <button class="ocs__btn small" type="button" data-size="xlarge" aria-pressed="false">A<span class="sr-only"> extra large</span></button>
    <button class="ocs__btn small accent" type="button" data-nod-toggle aria-pressed="false" title="Play hands-free: nod to press the highlighted button">Nod to select</button>
  </div>
</div>
<script type="module" src="{{ '/assets/js/fops/site.js' | relative_url }}"></script>
